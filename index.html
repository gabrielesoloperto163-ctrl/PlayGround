<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#91d4dc"><link rel="icon" href="data:,">
<title>Blocklands — esplora, costruisci, crea</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{color-scheme:dark;--ink:#f7f5e9;--muted:rgba(247,245,233,.68);--glass:rgba(27,39,35,.76);--line:rgba(255,255,255,.17);--lime:#c8f36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd9e4;color:var(--ink);font-family:'DM Sans',sans-serif;touch-action:none}#game{position:fixed;inset:0;display:block;width:100%;height:100%}.vignette{pointer-events:none;position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,#0d1b2538,transparent 25%,transparent 65%,#0d1b2559)}
.topbar{position:fixed;z-index:3;top:max(20px,env(safe-area-inset-top));left:26px;right:26px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--lime);color:#25342a;box-shadow:0 6px 24px #172a243c}.brand-mark svg{width:23px;height:23px}.brand-title{font:700 17px 'Space Grotesk',sans-serif;letter-spacing:-.7px;text-shadow:0 2px 8px #0005}.brand-sub{margin-top:1px;color:#ffffffc4;font-size:10px;font-weight:700;letter-spacing:1.55px;text-transform:uppercase}.world-info{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:14px;background:#1727258c;backdrop-filter:blur(12px);font-size:11px;font-weight:700}.world-info .dot{width:7px;height:7px;border-radius:50%;background:#c8f36a;box-shadow:0 0 10px #c8f36a}
.hint{position:fixed;z-index:2;top:82px;left:50%;transform:translateX(-50%);padding:8px 13px;border:1px solid #ffffff25;border-radius:20px;background:#17272570;backdrop-filter:blur(9px);font-size:11px;color:#fff;white-space:nowrap;pointer-events:none;text-shadow:0 1px 5px #000}.crosshair{position:fixed;z-index:2;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:.9}.crosshair:before,.crosshair:after{content:'';position:absolute;left:50%;top:50%;background:white;box-shadow:0 1px 3px #000;transform:translate(-50%,-50%);border-radius:2px}.crosshair:before{width:2px;height:15px}.crosshair:after{width:15px;height:2px}
.controls{position:fixed;z-index:4;inset:0;pointer-events:none}.joystick{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#192d2b63;border:1px solid #ffffff30;box-shadow:inset 0 0 28px #0002;pointer-events:auto;touch-action:none}.joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#f9f8ed,#d6dfc9);box-shadow:0 5px 16px #0005;border:1px solid #ffffffaa}.joy-label{position:absolute;left:0;right:0;bottom:-22px;text-align:center;color:#fff9;font-size:9px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 4px #000}
.actions{position:absolute;right:max(28px,env(safe-area-inset-right));bottom:max(38px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:13px;pointer-events:auto}.action{width:64px;height:64px;border:1px solid #ffffff70;border-radius:22px;background:#243631cf;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px #0003;backdrop-filter:blur(12px);cursor:pointer;touch-action:manipulation}.action svg{width:25px;height:25px}.action.primary{width:76px;height:76px;border-radius:26px;background:var(--lime);color:#28382a;border:0;box-shadow:0 8px 26px #15271d60}.action:active{transform:scale(.94)}.action.jump{width:50px;height:50px;border-radius:17px;font-size:19px;font-weight:800}.action-label{margin-top:-8px;text-transform:uppercase;font-size:9px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 4px #000}
.inventory{position:fixed;z-index:3;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;padding:7px;border:1px solid #ffffff32;border-radius:16px;background:#172622be;backdrop-filter:blur(14px);box-shadow:0 8px 28px #0003}.slot{position:relative;width:52px;height:54px;border:1px solid #ffffff22;border-radius:10px;background:#ffffff0b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}.slot.active{border:2px solid var(--lime);background:#c8f36a24;box-shadow:0 0 15px #c8f36a35}.swatch{width:23px;height:23px;border-radius:5px;box-shadow:inset 0 0 0 1px #ffffff38,0 2px 4px #0004;image-rendering:pixelated}.slot-name{font-size:8px;color:#ffffffb8;font-weight:700;line-height:1}.count{position:absolute;right:4px;top:2px;font-size:10px;font-weight:800;text-shadow:0 1px 3px #000}.mobile-tip{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);z-index:2;color:#ffffffc7;font-size:10px;white-space:nowrap;text-shadow:0 1px 5px #000;pointer-events:none}
.toast{position:fixed;z-index:8;top:25%;left:50%;transform:translate(-50%,-8px);padding:9px 14px;border:1px solid #ffffff32;border-radius:12px;background:#172622dc;backdrop-filter:blur(12px);font-size:12px;font-weight:700;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.progress{position:fixed;z-index:2;left:50%;top:calc(50% + 24px);width:72px;height:4px;transform:translateX(-50%);background:#ffffff55;border-radius:5px;overflow:hidden;opacity:0}.progress>i{display:block;width:0;height:100%;background:var(--lime)}.progress.on{opacity:1}
@media(max-width:600px){.topbar{left:16px;right:16px;top:max(14px,env(safe-area-inset-top))}.brand-mark{width:36px;height:36px;border-radius:12px}.brand-title{font-size:15px}.brand-sub{font-size:8px}.world-info{font-size:9px;padding:8px 10px}.hint{top:65px;font-size:10px}.joystick{width:112px;height:112px;left:max(18px,env(safe-area-inset-left));bottom:max(34px,env(safe-area-inset-bottom))}.joy-knob{width:48px;height:48px}.actions{right:max(18px,env(safe-area-inset-right));bottom:max(35px,env(safe-area-inset-bottom));gap:10px}.action{width:56px;height:56px;border-radius:19px}.action.primary{width:68px;height:68px;border-radius:23px}.inventory{bottom:max(20px,env(safe-area-inset-bottom));gap:3px;padding:5px;border-radius:13px}.slot{width:42px;height:47px}.swatch{width:20px;height:20px}.mobile-tip{bottom:83px;font-size:9px}}
@media(max-width:390px){.joystick{width:96px;height:96px}.joy-knob{width:42px;height:42px}.slot{width:36px}.inventory{gap:2px;padding:4px}.slot-name{font-size:7px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="game"></canvas><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Z" fill="currentColor"/><path d="m3.5 7.5 8.5 5 8.5-5M12 12.5V22" stroke="#c8f36a" stroke-width="1.5"/></svg></div><div><div class="brand-title">BLOCKLANDS</div><div class="brand-sub">il tuo mondo, un blocco alla volta</div></div></div><div class="world-info"><span class="dot"></span><span>MONDO 50 × 50</span><span style="opacity:.45">·</span><span id="coords">X 25 · Z 25</span></div></header>
<div class="hint" id="hint">Esplora la valle e costruisci qualcosa di tuo</div><div class="crosshair"></div><div class="progress" id="progress"><i id="progressFill"></i></div>
<div class="controls"><div class="joystick" id="joystick"><div class="joy-knob" id="joyKnob"></div><div class="joy-label">MUOVITI</div></div><div class="actions"><button class="action" id="breakBtn" aria-label="Rompi blocco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 4 6 6M5 19l9-9M4 20l5-1-4-4-1 5ZM13 5l2-2 6 6-2 2"/></svg></button><span class="action-label">ROMPI</span><button class="action primary" id="placeBtn" aria-label="Piazza blocco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V21"/></svg></button><span class="action-label">PIAZZA</span><button class="action jump" id="jumpBtn" aria-label="Salta">↑</button><span class="action-label">SALTA</span></div></div>
<div class="inventory" id="inventory"></div><div class="mobile-tip" id="tip">Trascina sullo schermo per guardarti intorno</div><div class="toast" id="toast"></div>
<script type="module" src="./game.js"></script>
</body></html>
