<body><canvas id="game" aria-label="Mondo a blocchi giocabile"></canvas>
<div class="hud"><div class="topbar"><div class="brand"><div class="logo">🌱</div><div><strong>Piccolo Mondo</strong><small>La tua avventura a blocchi</small></div></div><div class="stats"><div class="pill"><span>▦</span>50 × 50</div><div class="pill"><span>⌖</span><b id="coords">25, 25</b></div></div></div><div class="bottom"><div class="joystick-wrap"><div class="joystick panel" id="joystick"><div class="joy-knob" id="knob"></div><div class="joy-label">MUOVITI</div></div></div><div class="inventory panel"><div class="inv-label">ZAINO</div><div class="slot active" data-item="grass" title="Erba"><div class="swatch grass"></div><b class="qty" id="qty-grass">0</b><span class="slot-key">1</span></div><div class="slot" data-item="dirt" title="Terra"><div class="swatch dirt"></div><b class="qty" id="qty-dirt">8</b><span class="slot-key">2</span></div><div class="slot" data-item="wood" title="Legno"><div class="swatch wood"></div><b class="qty" id="qty-wood">0</b><span class="slot-key">3</span></div><div class="slot" data-item="stone" title="Pietra"><div class="swatch stone"></div><b class="qty" id="qty-stone">0</b><span class="slot-key">4</span></div></div><div class="actions"><button class="action break" id="breakBtn" aria-label="Rompi blocco"><span class="icon">⛏</span><span>ROMPI</span></button><button class="action place" id="placeBtn" aria-label="Piazza blocco"><span class="icon">▧</span><span>PIAZZA</span></button></div></div></div>
<div class="hint" id="hint">Muoviti con il joystick · tocca ROMPI o PIAZZA</div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const N=50,TW=54,TH=27,BH=22;let W=innerWidth,H=innerHeight,DPR=1,camX=0,camY=0,last=0,selected='grass',toastTimer=0;
const heights=Array.from({length:N},()=>Array(N).fill(0)),biomes=Array.from({length:N},()=>Array(N).fill('plain')),trees=new Map(),placed=new Map(),removed=new Set();const inventory={grass:0,dirt:8,wood:0,stone:0};
function hash(x,y){let n=Math.sin(x*127.1+y*311.7+17.3)*43758.5453;return n-Math.floor(n)}function smoothNoise(x,y){let ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);let a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);return (a+(b-a)*fx)*(1-fy)+(c+(d-c)*fx)*fy}
for(let x=0;x<N;x++)for(let y=0;y<N;y++){let n=smoothNoise(x*.11,y*.11)*.65+smoothNoise(x*.045+9,y*.045)*.35;let h=Math.max(0,Math.min(5,Math.round((n-.30)*8+1.1)));heights[x][y]=h;let f=smoothNoise(x*.075+35,y*.075-11);biomes[x][y]=f>.63?'forest':(f<.22?'rocky':'plain')}
for(let x=2;x<N-2;x++)for(let y=2;y<N-2;y++){let forest=biomes[x][y]==='forest',chance=forest?.13:(biomes[x][y]==='plain'?.012:.004);if(hash(x+91,y+122)<chance){let type=hash(x+2,y+5)>.84?'pine':'oak';trees.set(`${x},${y}`,{x,y,type,height:type==='pine'?4+Math.floor(hash(y,x)*2):3+Math.floor(hash(x,y)*2)})}}
let player={x:25,y:25,fx:1,fy:0,walk:0};let joy={x:0,y:0,id:null,cx:0,cy:0};const tileKey=(x,y)=>`${x},${y}`,inside=(x,y)=>x>=0&&y>=0&&x<N&&y<N;function topHeight(x,y){if(!inside(x,y))return 0;return heights[x][y]}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function proj(x,y,z=0){return {x:(x-y)*TW/2,y:(x+y)*TH/2-z*BH}}function camera(){let p=proj(player.x+.5,player.y+.5,topHeight(Math.floor(player.x),Math.floor(player.y)));camX=p.x-W/2;camY=p.y-H*.49}
function shade(hex,k){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,((n>>16)&255)*k|0)),g=Math.max(0,Math.min(255,((n>>8)&255)*k|0)),b=Math.max(0,Math.min(255,(n&255)*k|0));return `rgb(${r},${g},${b})`}
function poly(points,color,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function diamond(cx,cy,z,color){let yy=cy-z*BH;poly([[cx,yy],[cx+TW/2,yy+TH/2],[cx,yy+TH],[cx-TW/2,yy+TH/2]],color,'#18352224')}
function drawGround(x,y){let h=heights[x][y],p=proj(x,y),cx=p.x-camX,cy=p.y-camY;let grass=biomes[x][y]==='rocky'?'#929c91':(biomes[x][y]==='forest'?'#70aa5a':'#83c866'),dirt='#916444';if(h>0){let top=cy-h*BH,forwardX=inside(x+1,y)?heights[x+1][y]:0,forwardY=inside(x,y+1)?heights[x][y+1]:0;if(forwardX<h){let drop=(h-forwardX)*BH;poly([[cx+TW/2,top+TH/2],[cx,top+TH],[cx,top+TH+drop],[cx+TW/2,top+TH/2+drop]],shade(dirt,.68),'#382b1e33')}if(forwardY<h){let drop=(h-forwardY)*BH;poly([[cx-TW/2,top+TH/2],[cx,top+TH],[cx,top+TH+drop],[cx-TW/2,top+TH/2+drop]],shade(dirt,.85),'#382b1e33')}}diamond(cx,cy,h,grass);if(biomes[x][y]==='rocky'){for(let i=0;i<2;i++){let px=cx+(hash(x+i,y)*22-11),py=cy-h*BH+TH/2+(hash(y,x+i+8)*10-5);ctx.fillStyle='#d5d1b3aa';ctx.beginPath();ctx.arc(px,py,1.5,0,7);ctx.fill()}}}
function cube(x,y,z,type,scale=1){let p=proj(x+.5,y+.5),cx=p.x-camX,cy=p.y-camY,tw=TW*scale,th=TH*scale,bh=BH*scale;let colors={wood:['#bd8547','#946237','#70472e'],leaves:['#77bd63','#529248','#407b3e'],pine:['#478e56','#347448','#285c3c'],dirt:['#aa7951','#83583a','#69462f'],grass:['#8bc867','#986744','#785337'],stone:['#abb5af','#808a87','#68726f']};let c=colors[type]||colors.wood;let top=cy-z*BH;poly([[cx-tw/2,top],[cx,top+th/2],[cx,top+th],[cx-tw/2,top+th/2]],c[1]);poly([[cx,top+th/2],[cx+tw/2,top],[cx+tw/2,top+th/2],[cx,top+th]],c[2]);poly([[cx-tw/2,top],[cx,top+th/2],[cx+tw/2,top],[cx,top-th]],c[0],'#fff3');}
function drawTree(t){if(removed.has(tileKey(t.x,t.y)))return;let ground=heights[t.x][t.y],tall=t.height;if(t.type==='oak'){for(let z=1;z<=tall;z++)cube(t.x,t.y,ground+z,'wood',.66);let crown=ground+tall;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){for(let dz=0;dz<2;dz++){if(Math.abs(dx)+Math.abs(dy)+dz<4&&inside(t.x+dx,t.y+dy))cube(t.x+dx,t.y+dy,crown+dz,'leaves',.9)}}if(inside(t.x,t.y))cube(t.x,t.y,crown+2,'leaves',.84)}else{for(let z=1;z<=tall;z++)cube(t.x,t.y,ground+z,'wood',.58);for(let z=2;z<=tall+1;z++){let radius=z===tall+1?0:(z>tall-1?1:2);for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++)if(Math.abs(dx)+Math.abs(dy)<=radius+1&&inside(t.x+dx,t.y+dy))cube(t.x+dx,t.y+dy,ground+z,'pine',.9)}}}
function drawPlayer(){let p=proj(player.x+.5,player.y+.5,topHeight(Math.floor(player.x),Math.floor(player.y))),x=p.x-camX,y=p.y-camY;let bob=Math.sin(player.walk)*2;ctx.save();ctx.translate(x,y-bob);ctx.fillStyle='#17251d3d';ctx.beginPath();ctx.ellipse(0,3,11,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#325f9c';ctx.fillRect(-8,-27,16,19);ctx.fillStyle='#edc18f';ctx.fillRect(-7,-41,14,14);ctx.fillStyle='#594637';ctx.fillRect(-8,-43,16,5);ctx.fillStyle='#392d28';ctx.fillRect(player.fx>=0?1:-5,-36,3,3);ctx.fillStyle='#e2a56d';ctx.fillRect(-10,-24,3,13);ctx.fillRect(7,-24,3,13);ctx.fillStyle='#34495b';ctx.fillRect(-7,-9,5,9);ctx.fillRect(2,-9,5,9);ctx.restore()}
function target(){let x=Math.floor(player.x)+player.fx,y=Math.floor(player.y)+player.fy;if(player.fx===0&&player.fy===0)x++;return {x,y}}
function drawTarget(){let {x,y}=target();if(!inside(x,y))return;let p=proj(x,y),cx=p.x-camX,cy=p.y-camY-heights[x][y]*BH;ctx.save();ctx.strokeStyle='#ffdb75';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+TW/2,cy+TH/2);ctx.lineTo(cx,cy+TH);ctx.lineTo(cx-TW/2,cy+TH/2);ctx.closePath();ctx.stroke();ctx.restore()}
function render(){camera();ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a8d7e9');sky.addColorStop(.58,'#d4e8d0');sky.addColorStop(1,'#e2d6ad');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff4c4a0';ctx.beginPath();ctx.arc(W*.78,H*.19,34,0,Math.PI*2);ctx.fill();let range=Math.ceil((W+H)/TH)+12,cx=player.x,cy=player.y;let minX=Math.max(0,Math.floor(cx-range/2)),maxX=Math.min(N-1,Math.ceil(cx+range/2)),minY=Math.max(0,Math.floor(cy-range/2)),maxY=Math.min(N-1,Math.ceil(cy+range/2));let items=[];for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++)items.push({x,y,d:x+y});items.sort((a,b)=>a.d-b.d||a.x-b.x);for(let item of items){let{x,y}=item,p=proj(x+.5,y+.5,heights[x][y]);if(p.x-camX<-TW||p.x-camX>W+TW||p.y-camY<-160||p.y-camY>H+160)continue;drawGround(x,y);let placedType=placed.get(tileKey(x,y));if(placedType)cube(x,y,heights[x][y]+1,placedType,.9);let tree=trees.get(tileKey(x,y));if(tree)drawTree(tree);if(Math.floor(player.x)===x&&Math.floor(player.y)===y)drawPlayer()}drawTarget();}
let keys={};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if('1234'.includes(k)){let slots=['grass','dirt','wood','stone'];select(slots[Number(k)-1])}if(k===' '||k==='f')mine();if(k==='e')place()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
function update(dt){let ix=joy.x,iy=joy.y;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}if(len>.08){player.fx=Math.abs(ix)>Math.abs(iy)?Math.sign(ix):0;player.fy=Math.abs(iy)>=Math.abs(ix)?Math.sign(iy):0;let nx=Math.max(.15,Math.min(N-.85,player.x+ix*dt*3.1)),ny=Math.max(.15,Math.min(N-.85,player.y+iy*dt*3.1));let ox=Math.floor(player.x),oy=Math.floor(player.y),tx=Math.floor(nx),ty=Math.floor(ny);if(Math.abs(topHeight(tx,ty)-topHeight(ox,oy))<=1){player.x=nx;player.y=ny}else if(Math.abs(topHeight(tx,oy)-topHeight(ox,oy))<=1)player.x=nx;else if(Math.abs(topHeight(ox,ty)-topHeight(ox,oy))<=1)player.y=ny;player.walk+=dt*12}document.getElementById('coords').textContent=`${Math.floor(player.x)+1}, ${Math.floor(player.y)+1}`}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function notify(text){let el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1250)}function syncInventory(){for(let type in inventory)document.getElementById(`qty-${type}`).textContent=inventory[type]}
function mine(){let{x,y}=target();if(!inside(x,y)){notify('Qui finisce il mondo!');return}let key=tileKey(x,y);if(trees.has(key)&&!removed.has(key)){removed.add(key);inventory.wood+=3;syncInventory();notify('Albero raccolto · +3 legno');return}if(placed.has(key)){let type=placed.get(key);placed.delete(key);inventory[type]=(inventory[type]||0)+1;syncInventory();notify('Blocco raccolto!');return}if(heights[x][y]<=0){notify('Non puoi scavare oltre');return}heights[x][y]--;let type=biomes[x][y]==='rocky'&&heights[x][y]<2?'stone':'dirt';inventory[type]++;syncInventory();notify(type==='stone'?'Pietra raccolta':'Terra raccolta')}
function place(){let{x,y}=target();if(!inside(x,y)){notify('Scegli una casella vicina');return}if(inventory[selected]<=0){notify('Non hai blocchi di '+({grass:'erba',dirt:'terra',wood:'legno',stone:'pietra'}[selected]));return}let key=tileKey(x,y);if(placed.has(key)){notify('C’è già un blocco qui');return}if(trees.has(key)&&!removed.has(key)){notify('Rompi prima l’albero');return}placed.set(key,selected);inventory[selected]--;syncInventory();notify('Blocco piazzato!')}
function select(type){selected=type;document.querySelectorAll('.slot').forEach(el=>el.classList.toggle('active',el.dataset.item===type))}document.querySelectorAll('.slot').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();select(el.dataset.item)}));
document.getElementById('breakBtn').addEventListener('pointerdown',e=>{e.preventDefault();mine();e.currentTarget.classList.add('pressed')});document.getElementById('breakBtn').addEventListener('pointerup',e=>e.currentTarget.classList.remove('pressed'));document.getElementById('placeBtn').addEventListener('pointerdown',e=>{e.preventDefault();place();e.currentTarget.classList.add('pressed')});document.getElementById('placeBtn').addEventListener('pointerup',e=>e.currentTarget.classList.remove('pressed'));
const stick=document.getElementById('joystick'),knob=document.getElementById('knob');stick.addEventListener('pointerdown',e=>{e.preventDefault();stick.setPointerCapture(e.pointerId);joy.id=e.pointerId;const r=stick.getBoundingClientRect();joy.cx=r.left+r.width/2;joy.cy=r.top+r.height/2;moveJoy(e)});stick.addEventListener('pointermove',e=>{if(joy.id===e.pointerId)moveJoy(e)});function moveJoy(e){let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,max=(stick.clientWidth-knob.offsetWidth)/2,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;knob.style.left=`calc(50% + ${dx}px)`;knob.style.top=`calc(50% + ${dy}px)`}function endJoy(e){if(joy.id!==e.pointerId)return;joy.id=null;joy.x=joy.y=0;knob.style.left='50%';knob.style.top='50%'}stick.addEventListener('pointerup',endJoy);stick.addEventListener('pointercancel',endJoy);
canvas.addEventListener('pointerdown',e=>{let px=e.clientX+camX,py=e.clientY+camY;let gx=(px/(TW/2)+py/(TH/2))/2,gy=(py/(TH/2)-px/(TW/2))/2;gx=Math.floor(gx);gy=Math.floor(gy);if(inside(gx,gy)){let dx=gx-player.x,dy=gy-player.y;if(Math.abs(dx)+Math.abs(dy)<.7){dx=player.fx;dy=player.fy}if(Math.abs(dx)>=Math.abs(dy)){player.fx=Math.sign(dx)||1;player.fy=0}else{player.fx=0;player.fy=Math.sign(dy)||1}}});
setTimeout(()=>document.getElementById('hint').classList.add('hide'),6500);syncInventory();
})();
